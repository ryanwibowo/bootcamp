<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Withdraw</title>
</head>
<body>
<h1>Select Nominal</h1>

<form th:action="@{/processWithdraw}" method="post">
    <input type="hidden" name="accountNumber" th:value="${transactionRequest.accountNumber}">
    <input type="hidden" name="amount" value="10">
    <input type="submit" value="$10" />
</form>

<form th:action="@{/processWithdraw}" method="post">
    <input type="hidden" name="accountNumber" th:value="${transactionRequest.accountNumber}">
    <input type="hidden" name="amount" value="50">
    <input type="submit" value="$50" />
</form>

<form th:action="@{/processWithdraw}" method="post">
    <input type="hidden" name="accountNumber" th:value="${transactionRequest.accountNumber}">
    <input type="hidden" name="amount" value="100">
    <input type="submit" value="$100" />
</form>

<!-- Other Withdraw -->
<form th:action="@{/otherWithdraw}" method="get">
    <input type="hidden" name="accountNumber" th:value="${transactionRequest.accountNumber}">
    <input type="submit" value="Others" />
</form>
</body>
</html>
