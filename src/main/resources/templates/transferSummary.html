<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transfer Summary</title>
</head>
<body>
<h1>Transfer Summary</h1>

<div th:object="${transfer}">
    <p th:text="'Transaction Type    : ' + *{transactionType}"></p>
    <p th:text="'Transaction Date    : ' + *{transactionDate}"></p>
    <p th:text="'Source Account      : ' + *{accountNumber}"></p>
    <p th:text="'Destination Account : ' + *{destinationNumber}"></p>
    <p th:text="'Transfer Amount     : ' + *{amount}"></p>
    <p th:text="'Remaining Balance   : ' + *{accountBalance}"></p>
</div>

<!-- Continue Transaction -->
<form th:action="@{/login}" th:object="${loginRequest}" method="post">
    <input type="hidden" name="accountNumber" th:value="${transfer.account.accountNumber}">
    <input type="hidden" name="pin" th:value="${transfer.account.pin}">
    <input type="hidden" name="firstLogin" value="false" />
    <input type="submit" value="New Transaction" />
</form><br>

<!-- Logout -->
<form th:action="@{/}" method="get">
    <input type="submit" value="Logout" />
</form>

</body>
</html>
