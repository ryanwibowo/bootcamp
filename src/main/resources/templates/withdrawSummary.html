<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Withdraw Summary</title>
</head>
<body>
<h1>Withdraw Summary</h1>

<div th:object="${transaction}">
    <p th:text="'Date           : ' + *{transactionDate}"></p>
    <p th:text="'Transaction    : ' + *{transactionType}"></p>
    <p th:text="'Withdraw       : $' + *{amount}"></p>
    <p th:text="'Balance        : $' + *{accountBalance}"></p>
    <p th:text="'Account Number : ' + *{accountNumber}"></p>
</div>

<form action="/" method="get">
    <input type="submit" value="Back to Home" />
</form>
</body>
</html>
