<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h1>Login Page</h1>
<form action="/login" method="POST">
    <table>
        <tr>
            <td>Account Number:</td>
            <td><input type="text" name="accountNumber" required /></td>
        </tr>
        <tr>
            <td>PIN:</td>
            <td><input type="password" name="pin" required /></td>
        </tr>
        <tr>
            <td colspan="2">
                <input type="submit" value="Login"/>
            </td>
        </tr>
    </table>
</form>
</body>
</html>
